[project]
name = "terra-scrap"
version = "1.0.0"
description = "Multi-Website Scraping Platform with Authentication"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.1",
    "flask-mail>=0.9.1",
    "wtforms>=3.1.0",
    "werkzeug>=3.0.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=7.2.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/yourusername/terra-scrap"
Repository = "https://github.com/yourusername/terra-scrap.git"
Issues = "https://github.com/yourusername/terra-scrap/issues"

[project.scripts]
terra-scrap = "auth_app:main"
init-db = "init_db:main"